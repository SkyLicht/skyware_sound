[package]
name = "skyware"
description = "Skyware Sound: a music and game-audio workstation that AI assistants can drive over MCP"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
license.workspace = true
# Only sky-core and sky-runtime are meant for crates.io.
publish = false
default-run = "skyware"

[features]
default = ["gui"]
gui = ["dep:sky-ui"]
asio = ["sky-io/asio"]

[dependencies]
sky-core.workspace = true
sky-dsp.workspace = true
sky-model.workspace = true
sky-engine.workspace = true
sky-io = { workspace = true, features = ["device"] }
sky-session.workspace = true
sky-game.workspace = true
sky-mcp.workspace = true
sky-ui = { workspace = true, optional = true }
anyhow.workspace = true
assert_no_alloc.workspace = true
clap.workspace = true
directories.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
