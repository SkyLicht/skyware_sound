# cargo-deny settings for sky-runtime: it is embedded in games, so it and
# everything it depends on must be permissively licensed. No GPL, LGPL,
# AGPL or MPL code may enter this dependency graph.
# Run: cargo deny --manifest-path crates/sky-runtime/Cargo.toml check licenses

[graph]
all-features = true

[licenses]
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "BSL-1.0",
    "CC0-1.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
]
confidence-threshold = 0.9
