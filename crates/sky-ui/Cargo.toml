[package]
name = "sky-ui"
description = "The desktop interface for Skyware Sound"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
license.workspace = true
# Only sky-core and sky-runtime are meant for crates.io.
publish = false

[dependencies]
sky-core.workspace = true
sky-dsp.workspace = true
sky-pattern.workspace = true
sky-model.workspace = true
sky-engine.workspace = true
sky-io = { workspace = true, features = ["device"] }
sky-game.workspace = true
sky-session.workspace = true
sky-library.workspace = true
sky-check.workspace = true
anyhow.workspace = true
tracing.workspace = true
directories.workspace = true
egui.workspace = true
# OpenGL through glow works on both Linux and Windows without a GPU driver
# stack beyond OpenGL 2+, and keeps the build light. Persistence keeps the
# window's size and place, the zoom and the workspace layout between runs.
eframe = { workspace = true, features = ["default_fonts", "glow", "x11", "wayland", "persistence"] }
# The dockable workspace; serde saves its layout.
egui_dock = { workspace = true, features = ["serde"] }
serde.workspace = true
serde_json.workspace = true
# Native file dialogs. The portal backend talks to the desktop through a
# runtime-loaded libdbus (falling back to zenity), so no GTK is needed to build.
rfd = { version = "0.17", default-features = false, features = ["xdg-portal"] }
# Reads the images people pick for pictures and shrinks them to keep in a
# project; only the formats a picture can be made from.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp", "gif"] }
# Paste picture: an image or an image file copied in another app.
arboard = { version = "3.6", default-features = false, features = ["image-data"] }

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
# eframe without default features leaves out winit's runtime-loaded Wayland
# client and its window decorations; ask for both so the build needs no
# Wayland development files and windows get a title bar on GNOME.
winit = { version = "0.30", default-features = false, features = ["wayland-dlopen", "wayland-csd-adwaita"] }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
